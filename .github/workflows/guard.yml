name: Current member guard with observation gates
run-name: guard ${{ github.event.action }} PR ${{ github.event.pull_request.number }}
'on':
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize
    - edited
    - ready_for_review
    - closed
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  verify:
    name: Verify group version
    runs-on: ubuntu-latest
    concurrency:
      group: group-version-guard-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: master
        persist-credentials: false
    - name: Verify frozen sources
      run: python3 lab/verify-snapshot.py
    - name: Install deps
      run: pip install --quiet pyyaml
    - name: Hold edited check for observation
      if: github.event.action == 'edited' && github.event.pull_request.head.ref == 'lab/retarget'
      run: "for attempt in $(seq 1 180); do\n  if gh api \"repos/$GITHUB_REPOSITORY/git/ref/heads/lab/release-edited-check\"\
        \ >/dev/null 2>&1; then exit 0; fi\n  sleep 2\ndone\necho 'Observation gate timed out' >&2\nexit 1\n"
    - name: Mark version check pending
      run: "gh api \"repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA\" --method POST \\\n  -f state=pending -f context=group-version-guard\
        \ \\\n  -f description='正在检查成员版本与本轮发布记录' \\\n  -f target_url=\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"\
        \ > /dev/null\n"
    - name: Verify changelog version
      id: verify
      run: "python3 - <<'PY'\nimport base64\nimport json\nimport os\nimport re\nimport subprocess\nimport tempfile\n\
        from urllib.parse import urlencode\n\nimport yaml\n\nMARKER = \"<!-- group-release\\n\"\n\ndef api(path):\n\
        \    result = subprocess.run([\"gh\", \"api\", path], capture_output=True, text=True)\n    if result.returncode:\n\
        \        raise RuntimeError(f\"GitHub API 失败: {path}: {result.stderr.strip()}\")\n    return json.loads(result.stdout)\n\
        \ndef content(repo, path, sha):\n    value = api(f\"repos/{repo}/contents/{path}?{urlencode({'ref': sha})}\"\
        )\n    return base64.b64decode(value[\"content\"]).decode(\"utf-8\")\n\ndef head_version(repo, sha):\n \
        \   with tempfile.NamedTemporaryFile(mode=\"w\", encoding=\"utf-8\") as f:\n        f.write(content(repo,\
        \ \"debian/changelog\", sha))\n        f.flush()\n        result = subprocess.run([\"dpkg-parsechangelog\"\
        , \"-l\", f.name, \"-S\", \"Version\"],\n                                capture_output=True, text=True)\n\
        \    if result.returncode or not result.stdout.strip():\n        raise RuntimeError(f\"无法读取 {repo}@{sha}\
        \ 的 changelog: {result.stderr.strip()}\")\n    return result.stdout.strip()\n\ndef repo_names(cfg, group,\
        \ owner):\n    overrides = cfg.get(\"repo_overrides\", {})\n    return [f\"{owner}/{overrides.get(m, m)}\"\
        \ for m in cfg[\"groups\"][group][\"members\"]]\n\ndef release_record(repo, sha, group):\n    commit = api(f\"\
        repos/{repo}/git/commits/{sha}\")\n    for hops in range(101):\n        if MARKER in commit[\"message\"\
        ]:\n            release = json.loads(commit[\"message\"].split(MARKER, 1)[1].split(\"\\n-->\", 1)[0])\n\
        \            if release[\"group\"] != group or [p[\"sha\"] for p in commit[\"parents\"]] != [release[\"\
        base_sha\"]]:\n                raise RuntimeError(\"DDE 发布记录已改变，请先修复原基线 PR\")\n            return release\n\
        \        if hops == 100 or len(commit[\"parents\"]) != 2:\n            break\n        commit = api(f\"repos/{repo}/git/commits/{commit['parents'][0]['sha']}\"\
        )\n    raise RuntimeError(\"DDE 基线 PR 缺少原始发布记录，请先核实\")\n\ndef check(repo, pr):\n    before = head_version(repo,\
        \ pr[\"base\"][\"sha\"])\n    source = pr[\"head\"][\"repo\"]\n    if not source:\n        raise RuntimeError(\"\
        PR 来源仓库已删除，无法校验\")\n    after = head_version(source[\"full_name\"], pr[\"head\"][\"sha\"])\n    if before\
        \ == after:\n        return \"changelog 版本未变化\"\n    if subprocess.run([\"dpkg\", \"--compare-versions\"\
        , after, \"gt\", before]).returncode:\n        raise RuntimeError(f\"成员版本只能升版: {before} -> {after}\")\n\n\
        \    owner = repo.split(\"/\", 1)[0]\n    baseline = 'peeweep-test/dde-four-coordinator-20261111-033803'\n\
        \    default = api(f\"repos/{baseline}\")[\"default_branch\"]\n    cfg = yaml.safe_load(content(baseline,\
        \ \"groups.yaml\", default))\n    groups = [g for g in cfg[\"groups\"] if repo in repo_names(cfg, g, owner)]\n\
        \    if len(groups) != 1:\n        raise RuntimeError(f\"{repo} 不属于唯一的 DDE 版本组，请核实分组配置\")\n    group = groups[0]\n\
        \    query = urlencode({\"state\": \"all\", \"head\": f\"{owner}:baseline/{group}\",\n                 \
        \      \"sort\": \"created\", \"direction\": \"desc\", \"per_page\": 1})\n    prs = api(f\"repos/{baseline}/pulls?{query}\"\
        )\n    if not prs:\n        raise RuntimeError(f\"{group} 没有统一发布记录，请从 DDE Release group 发起，不能单独改版\")\n \
        \   baseline_pr = prs[0]\n    if (not baseline_pr[\"head\"][\"repo\"] or baseline_pr[\"head\"][\"repo\"\
        ][\"full_name\"] != baseline\n            or baseline_pr[\"head\"][\"ref\"] != f\"baseline/{group}\"\n \
        \           or baseline_pr[\"base\"][\"ref\"] != default):\n        raise RuntimeError(\"DDE 基线 PR 的来源或目标分支不符\"\
        )\n    release = release_record(baseline, baseline_pr[\"head\"][\"sha\"], group)\n    if (release[\"base_branch\"\
        ] != default\n            or [m[\"repo\"] for m in release[\"members\"]] != repo_names(cfg, group, owner)):\n\
        \        raise RuntimeError(\"DDE 本轮成员或目标分支已改变，请先核实原发布\")\n    member = next(m for m in release[\"members\"\
        ] if m[\"repo\"] == repo)\n    baseline_version = cfg[\"groups\"][group][\"version\"]\n    if \"version\"\
        \ in member:\n        baseline_version = baseline_version.split(\":\", 1)[-1]\n    if subprocess.run([\"\
        dpkg\", \"--compare-versions\", release[\"version\"], \"ge\", baseline_version]).returncode:\n        raise\
        \ RuntimeError(\"DDE 发布记录已过期，不能继续旧版本\")\n    target = member.get(\"version\", release[\"version\"])\n  \
        \  if subprocess.run([\"dpkg\", \"--validate-version\", target]).returncode:\n        raise RuntimeError(f\"\
        无效成员目标版本: {target}\")\n    if \"version\" in member and target.split(\":\", 1)[-1] != release[\"version\"\
        ]:\n        raise RuntimeError(\"成员目标版本与组版本不符\")\n    safe = re.sub(r\"[^A-Za-z0-9._-]+\", \"-\", target).strip(\"\
        -\")\n    branch = f\"release-{target}\" if group == \"G1\" else f\"automation/update-changelog/{safe}\"\
        \n    if (after != target or source[\"full_name\"] != repo or pr[\"head\"][\"ref\"] != branch\n        \
        \    or pr[\"base\"][\"ref\"] != member[\"base\"] or pr[\"created_at\"] < release[\"started_at\"]):\n  \
        \      raise RuntimeError(f\"{repo} 的改版 PR 不属于 {group} 本轮 {target}，请从 DDE Release group 发起\")\n    return\
        \ f\"{group} 本轮发布 {target}，成员 PR 与发布记录一致\"\n\ndef main():\n    repo = os.environ[\"GITHUB_REPOSITORY\"]\n\
        \    with open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\") as f:\n        event = json.load(f)\n\
        \    pr = api(f\"repos/{repo}/pulls/{event['number']}\")\n    if pr[\"head\"][\"sha\"] != os.environ[\"\
        PR_HEAD_SHA\"]:\n        raise RuntimeError(\"PR 提交已变化，请等待新提交的检查\")\n    query = urlencode({\"per_page\"\
        : 100})\n    related = api(f\"repos/{repo}/commits/{os.environ['PR_HEAD_SHA']}/pulls?{query}\")\n    open_prs\
        \ = [p for p in related\n                if p[\"state\"] == \"open\" and p[\"head\"][\"sha\"] == os.environ[\"\
        PR_HEAD_SHA\"]]\n    if not any(p[\"number\"] == pr[\"number\"] for p in open_prs) and pr[\"state\"] ==\
        \ \"open\":\n        open_prs.append(pr)\n    for item in open_prs:\n        check(repo, item)\n    print(f\"\
        同提交开放 PR 校验通过: {len(open_prs)}\")\n\nif __name__ == \"__main__\":\n    main()\nPY\n"
    - name: Wait for retarget after validation
      if: github.event.action == 'opened' && github.event.pull_request.head.ref == 'lab/retarget'
      run: "echo '::notice::RETARGET_GATE_READY: version validation has passed'\nfor attempt in $(seq 1 180); do\n\
        \  base=$(gh api \"repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}\" --jq .base.ref)\n\
        \  if [ \"$base\" = master ]; then exit 0; fi\n  sleep 2\ndone\necho 'Retarget gate timed out' >&2\nexit\
        \ 1\n"
    - name: Publish version check result
      if: always()
      env:
        VERIFY_OUTCOME: ${{ steps.verify.outcome }}
      run: "set -euo pipefail\ncurrent_state=success\nif [ \"$VERIFY_OUTCOME\" != \"success\" ]; then\n  current_state=failure\n\
        fi\nif ! numbers=\"$(gh api \"repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/pulls?per_page=100\" \\\n  \
        \  --jq \".[] | select(.state == \\\"open\\\" and .head.sha == \\\"$PR_HEAD_SHA\\\") | .number\")\"; then\n\
        \  echo '::error::无法刷新关联 PR，成员版本校验不能通过' >&2\n  current_state=failure\n  numbers=\nfi\nfor number in $numbers;\
        \ do\n  if ! state=\"$(gh pr view \"$number\" -R \"$GITHUB_REPOSITORY\" --json state --jq .state | tr '[:upper:]'\
        \ '[:lower:]')\"; then\n    echo \"::error::无法刷新 PR #$number，成员版本校验不能通过\" >&2\n    current_state=failure\n\
        \    break\n  elif [ \"$state\" != \"open\" ]; then\n    current_state=failure\n  fi\ndone\nif [ \"$current_state\"\
        \ = \"success\" ]; then\n  state=success\n  description='成员版本校验通过'\nelse\n  state=failure\n  description='成员版本校验失败，详见工作流日志'\n\
        fi\ngh api \"repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA\" --method POST \\\n  -f state=\"$state\" -f\
        \ context=group-version-guard \\\n  -f description=\"$description\" \\\n  -f target_url=\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"\
        \ > /dev/null\ntest \"$current_state\" = success\n"
